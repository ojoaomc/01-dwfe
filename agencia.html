<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout com CSS Grid</title>
    <style>
        * {
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            display: grid;
            grid-template-areas:
                "header header header"
                "main main main"
                "footer footer footer";
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            /* Define a largura das colunas */
            grid-template-rows: 5rem auto 4rem;
            /* Define a altura das linhas */
            height: 100vh;
        }

        .header {
            grid-area: header;
            background: #333;
            color: #eee;
            text-align: center;
            padding: 1rem;
        }


        .main {
            grid-area: main;
            background: #ddd;
            padding: 1rem;
        }

        .formulario {
            /*width: 3rem;*/
            height: 2rem;
            border: 0.1px solid white;
            border-radius: .5rem;
            padding: .5rem;
            margin: .5rem;
            
        }

        .footer {
            grid-area: footer;
            background: #333;
            color: #eee;
            text-align: center;
            padding: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="container">
            <div class="formulario">Origem</div>
            <div class="formulario">Destino</div>
            <div class="formulario">Dias</div>
            <div class="formulario">Preço</div>
        </div>  
        </div>
        
    <div class="main">
        
    </div>

        <div class="footer">Rodapé</div>
    </div>
</body>

</html>
